name: Deploy Moongazer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moongazer-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Add CLOUDFLARE_API_TOKEN in Actions secrets.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Add CLOUDFLARE_ACCOUNT_ID in Actions secrets.'; exit 1; }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build apps
        shell: bash
        run: |
          set -euo pipefail
          for app in apps/*/package.json; do
            dir="${app%/package.json}"
            bun install --cwd "$dir" --frozen-lockfile
            bun run --cwd "$dir" check
            bun run --cwd "$dir" test
            bun run --cwd "$dir" build
          done
          node homepage/build.mjs
          bun install --cwd deployment --frozen-lockfile
          mkdir -p deployment/evidence
      - name: Run structural checks and formal verification
        run: |
          bun _implementation/sync-shared.ts --check
          bun _implementation/sync-shared.ts --check --set daily
          bun _implementation/sync-shared.ts --check --set mastery
          python3 _implementation/check-content-hygiene.py
          python3 _implementation/formal/verify-state-machines.py
          python3 _implementation/audit-text-joins.py
      - name: Validate SEO before publication
        run: |
          bun test _implementation/seo.test.ts
          bun test homepage/tests
          python3 deployment/verify-seo.py
      - name: Upload and deploy apps
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: node deployment/deploy-ci.mjs
      # The apex has Pages Functions (/api/*) and a D1 binding from homepage/wrangler.toml,
      # so it is deployed with Wrangler instead of the Direct Upload script.
      - name: Deploy directory and API
        working-directory: homepage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ../deployment/node_modules/wrangler/bin/wrangler.js pages deploy dist --project-name moongazer --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: Verify live sites
        run: node deployment/verify-live.mjs
      - name: Verify live SEO
        run: python3 deployment/verify-seo.py --live
