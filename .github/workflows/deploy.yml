name: Deploy Moongazer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moongazer-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Add CLOUDFLARE_API_TOKEN in Actions secrets.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Add CLOUDFLARE_ACCOUNT_ID in Actions secrets.'; exit 1; }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build apps
        shell: bash
        run: |
          set -euo pipefail
          for app in apps/*/package.json; do
            dir="${app%/package.json}"
            bun install --cwd "$dir" --frozen-lockfile
            bun run --cwd "$dir" check
            bun run --cwd "$dir" test
            bun run --cwd "$dir" build
          done
          node homepage/build.mjs
          bun install --cwd deployment --frozen-lockfile
          mkdir -p deployment/evidence
      - name: Upload and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: node deployment/deploy-ci.mjs
      - name: Verify live sites
        run: node deployment/verify-live.mjs
